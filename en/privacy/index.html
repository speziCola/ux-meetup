    .lang-switch a{display:block;height:auto;text-decoration:none;padding:2px var(--space-2);border-radius:7px;font-weight:var(--weight-medium);font-size:var(--text-sm);line-height:var(--leading-sm);color:var(--fg-light);transition:color .15s ease,background-color .15s ease}
    .lang-switch a:hover{color:var(--fg-strong)}
    .lang-switch a[aria-current="page"]{background:var(--surface100);color:var(--fg-strong);box-shadow:0 0 0 1px var(--stroke),0 1px 2px rgb(var(--shadow-rgb) / .12)}

    /* legal pages (impressum, privacy): plain text column */
    .legal-page{min-height:60vh}
    .prose{max-width:720px;color:var(--fg-regular)}
    .prose h1{color:var(--fg-strong);margin-bottom:var(--space-4)}
    .prose h2{color:var(--fg-strong);font-family:var(--font-title);font-weight:var(--weight-heavy);font-size:var(--text-xl);line-height:var(--leading-xl);letter-spacing:var(--tracking-heading);margin-top:var(--space-6)}
    .prose p,.prose ul{margin-block:var(--space-2);font-size:var(--text-lg);line-height:var(--leading-lg)}
    .prose a{color:var(--fg-brand);text-underline-offset:3px}

    /* events (rendered by tools/build.mjs from content/events.json) */
    .events{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--space-4)}
    .event{display:flex;flex-direction:column;gap:var(--space-2)}
    .event time{color:var(--fg-brand)}
    .event-meta{color:var(--fg-light)}
    .event a{color:var(--fg-strong);text-underline-offset:3px;margin-top:auto}

    /* floating menu (Figma: Floating-Menu 153×48, Menu-Container 268×312 r28) — mobile only */
    .fmenu{display:none}

    /* ── responsive (Figma Mobile 360) ── */
    @media (max-width:1100px){
      .about{gap:var(--space-12)}
      .rating{width:380px}
    }
    @media (max-width:900px){
      .about{flex-direction:column}
      .rating{width:100%}
      .team{flex-direction:column}
      .person{flex-direction:row;align-items:center}
      .portrait{width:76.5px;height:76.5px}
      .portrait-placeholder{width:76.5px;height:76.5px;flex:none}
      .portrait-placeholder span{font-size:1.75rem}
      .talk{flex-direction:column;gap:var(--space-8)}
    }
    @media (max-width:720px){
      .logo-word{height:15px}
      .navlinks{display:none}
      .btn-outline{padding:var(--space-1) var(--space-3)}
      .sponsoring{padding-bottom:var(--section-pad)}
      .hero-art{right:0;top:var(--space-8);bottom:auto;width:360px;height:265px}
      .stat{max-width:none}
      .stat.sponsor{flex-basis:100%;border-left:0;border-top:1px solid var(--stroke)}
      .footer{padding-bottom:72px}
      .footer .nav{flex-direction:column;align-items:flex-start;height:auto;padding-block:var(--space-4)}
      .footlinks{flex-direction:column;align-items:flex-start;padding-left:0;justify-content:flex-start}
      .footlinks a{height:44px;font-size:var(--text-md);padding-inline:0}
      .foot-prefs{display:none} /* language lives in the menu, theme in the pill */

      .fmenu{display:block;position:fixed;z-index:var(--z-menu);right:var(--space-2);bottom:calc(9px + env(safe-area-inset-bottom,0px));width:300px;height:312px;pointer-events:none;
        border:1px solid var(--stroke);border-radius:28px;
        clip-path:inset(256px 7px 7px 108px round 24px);transition:clip-path .42s var(--ease-spring)}
      .fmenu.open{clip-path:inset(-1px round 28px);pointer-events:auto;background:var(--surface100);box-shadow:0 12px 40px rgb(var(--shadow-rgb) / .18)}
      .fpill{position:absolute;right:7px;bottom:7px;height:48px;display:flex;align-items:center;justify-content:space-between;border-radius:var(--radius-pill);background:var(--bg-inverse);color:var(--fg-inverse);pointer-events:auto}
      .fmenu.over-talk .fpill{background:var(--surface100);color:var(--fg-strong);box-shadow:0 0 0 1px var(--stroke),0 8px 24px rgb(var(--shadow-rgb) / .18)}
      .fpill button{display:flex;align-items:center;gap:var(--space-2);height:48px;font-weight:var(--weight-medium);font-size:var(--text-sm);line-height:var(--leading-sm)}
      .fpill-menu{padding:0 var(--space-4)}
      .fpill-div{width:1px;height:24px;background:var(--stroke)}
      .fpill-theme{position:relative;padding:0 var(--space-6)}
      .fmenu-links{position:absolute;left:-1px;top:-1px;width:268px;padding:var(--space-4) var(--space-4) 0;display:flex;flex-direction:column}
      /* links stagger: closing runs bottom-up, opening top-down (40ms steps) */
      /* bottom-left of the open panel: left edge on the link text, vertically centered on the pill */
      .fmenu-lang{position:absolute;left:24px;bottom:13px;--i:4}
      .fmenu-links a,.fmenu-lang{opacity:0;transform:translateY(8px);transition:opacity .3s ease,transform .3s var(--ease-spring);transition-delay:calc(.22s - var(--i) * .04s)}
      .fmenu-links a:nth-child(1){--i:0}
      .fmenu-links a:nth-child(2){--i:1}
      .fmenu-links a:nth-child(3){--i:2}
      .fmenu-links a:nth-child(4){--i:3}
      .fmenu.open .fmenu-links a,.fmenu.open .fmenu-lang{opacity:1;transform:none;transition-delay:calc(.1s + var(--i) * .04s)}
    }

    @media (prefers-reduced-motion:reduce){
      .focus-shape{animation:none}
    }
  }

  /* ───────────────────────── utilities ───────────────────────── */
  @layer utilities{
    .font-color-regular{color:var(--fg-regular)}
    .font-color-light{color:var(--fg-light)}
    .measure{max-width:850px}
  }

(()=>{const root=document.documentElement;
try{const theme=localStorage.getItem("uxfr-theme");if(theme)root.dataset.theme=theme}catch{}
/* First visit to the English home page with a German browser: go to /de/. A language picked in the switcher is stored and always wins. */
if(root.dataset.page==="home"&&root.lang==="en"){let lang=null;try{lang=localStorage.getItem("uxfr-lang")}catch{}
if(!lang&&(navigator.languages||[navigator.language]).map(l=>String(l).slice(0,2).toLowerCase()).find(l=>l==="en"||l==="de")==="de")location.replace("/de/"+location.hash)}})();</script>
